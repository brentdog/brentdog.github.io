name: Build and Deploy Photo Gallery

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Album Metadata
        uses: actions/cache@v4
        with:
          path: cache.json
          key: album-cache-${{ hashFiles('google_photos_albums.json') }}
          restore-keys: |
            album-cache-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Gallery Builder Script
        run: python build_gallery.py

      - name: Commit and Push Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update gallery index & cache" && git push)
