name: Build and Deploy Photo Gallery

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Gallery Builder Script
        env:
          GPHOTOS_CLIENT_ID: ${{ secrets.GPHOTOS_CLIENT_ID }}
          GPHOTOS_CLIENT_SECRET: ${{ secrets.GPHOTOS_CLIENT_SECRET }}
          GPHOTOS_REFRESH_TOKEN: ${{ secrets.GPHOTOS_REFRESH_TOKEN }}
        run: python build_gallery.py

      - name: Commit and Push Updated Gallery
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update gallery index" && git push)
